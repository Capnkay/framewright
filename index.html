<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Framewright</title>
<meta http-equiv="refresh" content="0; url=docs/html/index.html">
<link rel="canonical" href="docs/html/index.html">
<style>
  :root{ --ink:#1a1a1a; --ink2:#5a5a5a; --paper:#fdfdfb; --green:#b2f2bb; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --ink:#e9ece9; --ink2:#a7aeb0; --paper:#111417; --green:#1d2b22; }
  }
  :root[data-theme="dark"]{ --ink:#e9ece9; --ink2:#a7aeb0; --paper:#111417; --green:#1d2b22; }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .box{
    max-width:440px; text-align:center;
    border:2.4px solid var(--ink); border-radius:14px; padding:26px 28px;
    background:var(--green); box-shadow:4px 5px 0 rgba(26,26,26,.14);
  }
  h1{font-family:'Segoe Print','Bradley Hand','Comic Sans MS',cursive;
     font-size:26px; margin:0 0 6px}
  p{margin:0 0 16px; color:var(--ink2); font-size:14.5px; line-height:1.55}
  a.go{
    display:inline-block; text-decoration:none; color:var(--paper); background:var(--ink);
    border:2.4px solid var(--ink); border-radius:9px; padding:9px 20px;
    font-weight:600; font-size:15px;
  }
  a.go:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
  <div class="box">
    <h1>Framewright</h1>
    <p>Taking you to the documentation. If nothing happens, use the link below.</p>
    <a class="go" href="docs/html/index.html">Open the docs</a>
  </div>
  <script>location.replace("docs/html/index.html");</script>
</body>
</html>
